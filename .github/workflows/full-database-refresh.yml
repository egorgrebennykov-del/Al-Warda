name: "Full Database Refresh: Complete Catalog & Image Rebuild"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-refresh:
    name: Full Database & Image Rebuild
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Database Refresh and Render Studio Images
        run: |
          python Al-Warda/scripts/qogita_weekly_sync_upscayl.py \
            --cloud \
            --all \
            --force
        env:
          QOGITA_EMAIL: ${{ secrets.QOGITA_EMAIL }}
          QOGITA_PASSWORD: ${{ secrets.QOGITA_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mfvenfrmlkxqgvdtedet.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || 'sb_publishable_lTPiPLbRAqlq5B1PzAE1Vw_nN58DXgB' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_lTPiPLbRAqlq5B1PzAE1Vw_nN58DXgB' }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Al-Warda/package.json

      - name: Install Node Dependencies
        run: |
          npm --prefix Al-Warda install

      - name: Sync Supabase Stocks & Olfactory Notes
        run: |
          node --use-system-ca Al-Warda/scripts/sync-stocks-supabase.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mfvenfrmlkxqgvdtedet.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || 'sb_publishable_lTPiPLbRAqlq5B1PzAE1Vw_nN58DXgB' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_lTPiPLbRAqlq5B1PzAE1Vw_nN58DXgB' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Rebuild Web Application
        run: |
          npm --prefix Al-Warda run build

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Full Database Refresh]"
          git add Al-Warda/server/data/ Al-Warda/public/assets/img/dropship/ Al-Warda/public/assets/img/products/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(catalog): full database refresh & catalog rebuild [skip ci]"
            git push origin main
          fi
