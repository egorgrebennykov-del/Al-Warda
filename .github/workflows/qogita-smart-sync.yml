name: "Aromadeal Smart Sync: Catalog, Prices & Trends"

on:
  schedule:
    # Автоматический запуск по понедельникам в 04:00 UTC (независимо от состояния вашего ПК)
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-catalog-and-image-queue
  cancel-in-progress: false

jobs:
  smart-sync:
    name: Smart Incremental Catalog Sync
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sync Aromadeal catalog, prices & availability
        run: |
          python Al-Warda/scripts/aromadeal_sync.py --prices
        env:
          NHOST_ADMIN_SECRET: ${{ secrets.NHOST_ADMIN_SECRET }}
          NHOST_GRAPHQL_URL: https://jopiirogydgupiwqiwac.graphql.eu-central-1.nhost.run/v1

      - name: Sync competitor prices & recalculate retail prices
        run: |
          python Al-Warda/scripts/sync_competitor_prices.py
        env:
          NHOST_ADMIN_SECRET: ${{ secrets.NHOST_ADMIN_SECRET }}
          NHOST_GRAPHQL_URL: https://jopiirogydgupiwqiwac.graphql.eu-central-1.nhost.run/v1

      - name: Ensure minimum visible catalog (500)
        run: |
          python Al-Warda/scripts/google_trends_filter.py --ensure-min-500
        env:
          SUPABASE_URL: https://al-warda.egor-grebennykov.workers.dev
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          NHOST_ADMIN_SECRET: ${{ secrets.NHOST_ADMIN_SECRET }}
          NHOST_GRAPHQL_URL: https://jopiirogydgupiwqiwac.graphql.eu-central-1.nhost.run/v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Al-Warda/package.json

      - name: Install Node Dependencies
        run: |
          npm --prefix Al-Warda install

      - name: Rebuild Web Application
        run: |
          npm --prefix Al-Warda run build

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Aromadeal Smart Sync]"
          git add Al-Warda/server/data/
          if git diff --staged --quiet; then
            echo "No changes to commit. Catalog is already up to date."
          else
            git commit -m "chore(sync): update Aromadeal catalog and Trends cache [skip ci]"
            git push origin main
          fi
