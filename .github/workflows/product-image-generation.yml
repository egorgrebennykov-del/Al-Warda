name: Product Image Generation

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      max_images:
        description: "Maximum products to attempt in this run (1–100000)"
        required: true
        type: number
        default: 500
      cloudflare_account:
        description: "Cloudflare account (automatic switches on provider limits)"
        required: true
        type: choice
        options:
          - auto
          - primary
          - secondary
          - third
          - fourth
          - fifth
        default: auto
      regenerate_completed:
        description: "Replace completed images made with older models"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: product-catalog-and-image-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SUPABASE_URL: https://mfvenfrmlkxqgvdtedet.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED: ${{ secrets.CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED }}
      SECONDARY_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_SECONDARY_ACCOUNT_ID }}
      SECONDARY_API_TOKEN: ${{ secrets.CLOUDFLARE_SECONDARY_API_TOKEN }}
      SECONDARY_FREE_CONFIRMED: ${{ secrets.CLOUDFLARE_SECONDARY_FREE_PLAN_CONFIRMED }}
      THIRD_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_THIRD_ACCOUNT_ID }}
      THIRD_API_TOKEN: ${{ secrets.CLOUDFLARE_THIRD_API_TOKEN }}
      THIRD_FREE_CONFIRMED: ${{ secrets.CLOUDFLARE_THIRD_FREE_PLAN_CONFIRMED }}
      FOURTH_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FOURTH_ACCOUNT_ID }}
      FOURTH_API_TOKEN: ${{ secrets.CLOUDFLARE_FOURTH_API_TOKEN }}
      FOURTH_FREE_CONFIRMED: ${{ secrets.CLOUDFLARE_FOURTH_FREE_PLAN_CONFIRMED }}
      FIFTH_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_FIFTH_ACCOUNT_ID }}
      FIFTH_API_TOKEN: ${{ secrets.CLOUDFLARE_FIFTH_API_TOKEN }}
      FIFTH_FREE_CONFIRMED: ${{ secrets.CLOUDFLARE_FIFTH_FREE_PLAN_CONFIRMED }}
      CLOUDFLARE_IMAGE_ACCOUNT: ${{ inputs.cloudflare_account || 'auto' }}
    steps:
      - name: Check required server secrets
        shell: bash
        run: |
          test "${{ github.ref }}" = "refs/heads/main" || { echo "::error::Run this workflow on main"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
      - uses: actions/checkout@v6
        id: checkout
        with:
          fetch-depth: 0
      - name: Check queue and account readiness for scheduled run
        id: schedule_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python3 Al-Warda/scripts/generate_product_images.py --check-schedule-ready >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.schedule_gate.outputs.should_run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install image processing dependencies
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt
      - name: Configure segmentation model directory
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: echo "U2NET_HOME=$RUNNER_TEMP/al-warda-u2net" >> "$GITHUB_ENV"
      - name: Restore segmentation model cache
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/al-warda-u2net
          key: u2net-8d10d2f3bb75ae3b6d527c77944fc5e7dcd94b29809d47a739a7a728a912b491
      - name: Finish previously deployed images
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: python Al-Warda/scripts/generate_product_images.py --publish-only
      - name: Process queued products
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          MAX_IMAGES: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.max_images) || '500' }}
          REGENERATE_COMPLETED: ${{ inputs.regenerate_completed || false }}
        run: |
          if [ "$REGENERATE_COMPLETED" = "true" ]; then
            python Al-Warda/scripts/generate_product_images.py --max-images "$MAX_IMAGES" --regenerate-completed
          else
            python Al-Warda/scripts/generate_product_images.py --max-images "$MAX_IMAGES"
          fi
      - name: Commit and publish generated images
        id: publish
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.schedule_gate.outputs.should_run == 'true' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          if [ -d Al-Warda/public/assets/img/generated-products ]; then
            git add Al-Warda/public/assets/img/generated-products/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated product images"
            git diff-tree --no-commit-id --name-only -r HEAD -- Al-Warda/public/assets/img/generated-products/ > "$RUNNER_TEMP/generated-image-paths.txt"
            git bundle create "$RUNNER_TEMP/generated-images.bundle" HEAD ^HEAD^
            echo "backup_created=true" >> "$GITHUB_OUTPUT"
            bash .github/scripts/push-main-with-retry.sh
          fi
      - name: Preserve generated images if publishing failed
        if: ${{ always() && steps.publish.outcome == 'failure' && steps.publish.outputs.backup_created == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-generated-images
          path: ${{ runner.temp }}/generated-images.bundle
          if-no-files-found: error
          retention-days: 30
      - name: Mark unpublished images for retry
        if: ${{ always() && steps.publish.outcome == 'failure' && steps.publish.outputs.backup_created == 'true' }}
        shell: bash
        run: |
          git fetch origin main
          : > "$RUNNER_TEMP/unpublished-image-paths.txt"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            published=$(git ls-tree --name-only FETCH_HEAD -- "$path")
            if [ -z "$published" ]; then
              printf '%s\n' "$path" >> "$RUNNER_TEMP/unpublished-image-paths.txt"
            fi
          done < "$RUNNER_TEMP/generated-image-paths.txt"
          python Al-Warda/scripts/generate_product_images.py --mark-unpublished-failed "$RUNNER_TEMP/unpublished-image-paths.txt"
      - name: Verify deployment and complete queue items
        id: verify
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: python Al-Warda/scripts/generate_product_images.py --publish-only
      - name: Remove replaced generated images
        if: ${{ always() && steps.verify.outcome == 'success' }}
        run: |
          python Al-Warda/scripts/generate_product_images.py --cleanup-replaced
          if [ -d Al-Warda/public/assets/img/generated-products ]; then
            git add -u Al-Warda/public/assets/img/generated-products/
          fi
          if ! git diff --cached --quiet; then
            git config user.name "GitHub Actions"
            git config user.email "action@github.com"
            git commit -m "Remove replaced product images"
            bash .github/scripts/push-main-with-retry.sh
          fi
