name: Product Image Generation

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      max_images:
        description: "Maximum products to attempt in this run (1–100000)"
        required: true
        type: number
        default: 500
      cloudflare_account:
        description: "Account / pipeline selector (legacy Cloudflare or local)"
        required: false
        type: string
        default: local
      regenerate_completed:
        description: "Replace completed images made with older models"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: product-catalog-and-image-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SUPABASE_URL: https://al-warda.egor-grebennykov.workers.dev/api
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEP_SEEK_API }}
    steps:
      - name: Check required server secrets
        shell: bash
        run: |
          test "${{ github.ref }}" = "refs/heads/main" || { echo "::error::Run this workflow on main"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
      - uses: actions/checkout@v6
        id: checkout
        with:
          fetch-depth: 0
      - name: Check queue and account readiness for scheduled run
        id: schedule_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLOUDFLARE_IMAGE_ACCOUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_account || 'local' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED: ${{ secrets.CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python3 Al-Warda/scripts/generate_product_images.py --check-schedule-ready >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install image processing dependencies
        run: python -m pip install -r requirements.txt
      - name: Finish previously deployed images
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: python Al-Warda/scripts/generate_product_images.py --complete-committed
      - name: Configure segmentation model directory
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          echo "RMBG_HOME=$RUNNER_TEMP/al-warda-rmbg" >> "$GITHUB_ENV"
          echo "U2NET_HOME=$RUNNER_TEMP/al-warda-rmbg" >> "$GITHUB_ENV"
      - name: Restore segmentation model cache
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/al-warda-rmbg
          key: rmbg-8cafcf770b06757c4eaced21b1a88e57fd2b66de01b8045f35f01535ba742e0f
      - name: Restore super-resolution engine cache
        if: steps.schedule_gate.outputs.should_run == 'true'
        id: cache_realesrgan
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/al-warda-realesrgan
          key: realesrgan-v0.2.5.0-ubuntu
      - name: Download super-resolution engine
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.cache_realesrgan.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/al-warda-realesrgan"
          curl -sL "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip" -o "$RUNNER_TEMP/realesrgan.zip" || true
          if [ -f "$RUNNER_TEMP/realesrgan.zip" ]; then
            unzip -q -o "$RUNNER_TEMP/realesrgan.zip" -d "$RUNNER_TEMP/al-warda-realesrgan" || true
            chmod +x "$RUNNER_TEMP/al-warda-realesrgan/realesrgan-ncnn-vulkan" 2>/dev/null || true
          fi
      - name: Configure super-resolution environment
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/al-warda-realesrgan/realesrgan-ncnn-vulkan" ]; then
            echo "UPSCAYL_BIN=$RUNNER_TEMP/al-warda-realesrgan/realesrgan-ncnn-vulkan" >> "$GITHUB_ENV"
            echo "UPSCAYL_MODELS=$RUNNER_TEMP/al-warda-realesrgan/models" >> "$GITHUB_ENV"
          fi
      - name: Process queued products
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          MAX_IMAGES: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.max_images) || '500' }}
          REGENERATE_COMPLETED: ${{ inputs.regenerate_completed || false }}
          CLOUDFLARE_IMAGE_ACCOUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_account || 'local' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED: ${{ secrets.CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED }}
        run: |
          if [ "$REGENERATE_COMPLETED" = "true" ]; then
            python Al-Warda/scripts/generate_product_images.py --max-images "$MAX_IMAGES" --regenerate-completed
          else
            python Al-Warda/scripts/generate_product_images.py --max-images "$MAX_IMAGES"
          fi
      - name: Commit and publish generated images
        id: publish
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.schedule_gate.outputs.should_run == 'true' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          if [ -d Al-Warda/public/assets/img/generated-products ]; then
            git add Al-Warda/public/assets/img/generated-products/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated product images"
            git diff-tree --no-commit-id --name-only -r HEAD -- Al-Warda/public/assets/img/generated-products/ > "$RUNNER_TEMP/generated-image-paths.txt"
            git bundle create "$RUNNER_TEMP/generated-images.bundle" HEAD ^HEAD^
            echo "backup_created=true" >> "$GITHUB_OUTPUT"
            bash .github/scripts/push-main-with-retry.sh
          fi
      - name: Preserve generated images if publishing failed
        if: ${{ always() && steps.publish.outcome == 'failure' && steps.publish.outputs.backup_created == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-generated-images
          path: ${{ runner.temp }}/generated-images.bundle
          if-no-files-found: error
          retention-days: 30
      - name: Mark unpublished images for retry
        if: ${{ always() && steps.publish.outcome == 'failure' && steps.publish.outputs.backup_created == 'true' }}
        shell: bash
        run: |
          git fetch origin main
          : > "$RUNNER_TEMP/unpublished-image-paths.txt"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            published=$(git ls-tree --name-only FETCH_HEAD -- "$path")
            if [ -z "$published" ]; then
              printf '%s\n' "$path" >> "$RUNNER_TEMP/unpublished-image-paths.txt"
            fi
          done < "$RUNNER_TEMP/generated-image-paths.txt"
          python Al-Warda/scripts/generate_product_images.py --mark-unpublished-failed "$RUNNER_TEMP/unpublished-image-paths.txt"
      - name: Verify deployment and complete queue items
        id: verify
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: python Al-Warda/scripts/generate_product_images.py --complete-committed
      - name: Remove replaced generated images
        if: ${{ always() && steps.verify.outcome == 'success' }}
        run: |
          python Al-Warda/scripts/generate_product_images.py --cleanup-replaced
          if [ -d Al-Warda/public/assets/img/generated-products ]; then
            git add -u Al-Warda/public/assets/img/generated-products/
          fi
          if ! git diff --cached --quiet; then
            git config user.name "GitHub Actions"
            git config user.email "action@github.com"
            git commit -m "Remove replaced product images"
            bash .github/scripts/push-main-with-retry.sh
          fi
