name: Product Image Generation

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-catalog-and-image-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: https://mfvenfrmlkxqgvdtedet.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED: ${{ secrets.CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED }}
    steps:
      - name: Check required server secrets
        shell: bash
        run: |
          test "${{ github.ref }}" = "refs/heads/main" || { echo "::error::Run this workflow on main"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test "$CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED" = "true" || { echo "::error::Confirm Cloudflare Workers AI Free plan before running"; exit 1; }
          echo "U2NET_HOME=$RUNNER_TEMP/al-warda-u2net" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install image processing dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore U2Net model cache
        uses: actions/cache@v4
        with:
          path: ${{ env.U2NET_HOME }}
          key: u2net-8d10d2f3bb75ae3b6d527c77944fc5e7dcd94b29809d47a739a7a728a912b491
      - name: Finish previously deployed images
        run: python Al-Warda/scripts/generate_product_images.py --publish-only
      - name: Process up to 160 queued products
        run: python Al-Warda/scripts/generate_product_images.py --max-images 160
      - name: Commit and publish generated images
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          if [ -d Al-Warda/public/assets/img/generated-products ]; then
            git add Al-Warda/public/assets/img/generated-products/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated product images"
            git push origin HEAD:main
          fi
      - name: Verify deployment and complete queue items
        run: python Al-Warda/scripts/generate_product_images.py --publish-only
