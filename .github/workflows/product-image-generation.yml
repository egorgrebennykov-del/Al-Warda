name: Product Image Generation

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      max_images:
        description: "Maximum products to attempt in this run (1–100000)"
        required: true
        type: number
        default: 160
      cloudflare_account:
        description: "Cloudflare account used for image editing"
        required: true
        type: choice
        options:
          - primary
          - secondary
        default: primary
      regenerate_completed:
        description: "Replace completed images made with older models"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: product-catalog-and-image-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: https://mfvenfrmlkxqgvdtedet.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED: ${{ secrets.CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED }}
      SECONDARY_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_SECONDARY_ACCOUNT_ID }}
      SECONDARY_API_TOKEN: ${{ secrets.CLOUDFLARE_SECONDARY_API_TOKEN }}
      SECONDARY_FREE_CONFIRMED: ${{ secrets.CLOUDFLARE_SECONDARY_FREE_PLAN_CONFIRMED }}
    steps:
      - name: Check required server secrets
        shell: bash
        run: |
          test "${{ github.ref }}" = "refs/heads/main" || { echo "::error::Run this workflow on main"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
      - name: Select Cloudflare account
        env:
          SELECTED_ACCOUNT: ${{ inputs.cloudflare_account || 'primary' }}
        shell: bash
        run: |
          if [ "$SELECTED_ACCOUNT" = "secondary" ]; then
            test -n "$SECONDARY_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_SECONDARY_ACCOUNT_ID is missing"; exit 1; }
            test -n "$SECONDARY_API_TOKEN" || { echo "::error::CLOUDFLARE_SECONDARY_API_TOKEN is missing"; exit 1; }
            test "$SECONDARY_FREE_CONFIRMED" = "true" || { echo "::error::Confirm the secondary account is on the Free plan"; exit 1; }
            echo "CLOUDFLARE_ACCOUNT_ID=$SECONDARY_ACCOUNT_ID" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_API_TOKEN=$SECONDARY_API_TOKEN" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED=true" >> "$GITHUB_ENV"
          elif [ "$SELECTED_ACCOUNT" = "primary" ]; then
            test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
            test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
            test "$CLOUDFLARE_WORKERS_AI_FREE_PLAN_CONFIRMED" = "true" || { echo "::error::Confirm Cloudflare Workers AI Free plan before running"; exit 1; }
          else
            echo "::error::Unknown Cloudflare account"; exit 1
          fi
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install image processing dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure segmentation model directory
        run: echo "U2NET_HOME=$RUNNER_TEMP/al-warda-u2net" >> "$GITHUB_ENV"
      - name: Restore segmentation model cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/al-warda-u2net
          key: u2net-8d10d2f3bb75ae3b6d527c77944fc5e7dcd94b29809d47a739a7a728a912b491
      - name: Finish previously deployed images
        run: python Al-Warda/scripts/generate_product_images.py --publish-only
      - name: Process queued products
        env:
          MAX_IMAGES: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.max_images) || '160' }}
          REGENERATE_COMPLETED: ${{ inputs.regenerate_completed || false }}
        run: |
          if [ "$REGENERATE_COMPLETED" = "true" ]; then
            python Al-Warda/scripts/generate_product_images.py --max-images "$MAX_IMAGES" --regenerate-completed
          else
            python Al-Warda/scripts/generate_product_images.py --max-images "$MAX_IMAGES"
          fi
      - name: Commit and publish generated images
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          if [ -d Al-Warda/public/assets/img/generated-products ]; then
            git add Al-Warda/public/assets/img/generated-products/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated product images"
            git push origin HEAD:main
          fi
      - name: Verify deployment and complete queue items
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: python Al-Warda/scripts/generate_product_images.py --publish-only
