name: Delete product images

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Selected product IDs and their current image URLs"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: product-catalog-and-image-queue
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://mfvenfrmlkxqgvdtedet.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Return selected products to the queue
        id: delete
        env:
          SELECTED_IMAGES: ${{ inputs.images }}
        run: python Al-Warda/scripts/generate_product_images.py --delete-selected
      - name: Remove unreferenced images
        if: ${{ always() && (steps.delete.outcome == 'success' || steps.delete.outcome == 'failure') }}
        run: |
          python Al-Warda/scripts/generate_product_images.py --cleanup-replaced
          if [ -d Al-Warda/public/assets/img/generated-products ]; then
            git add -u Al-Warda/public/assets/img/generated-products/
          fi
          if ! git diff --cached --quiet; then
            git config user.name "GitHub Actions"
            git config user.email "action@github.com"
            git commit -m "Remove selected product images"
            git push origin HEAD:main
          fi
