name: "Google Trends Catalog Filter"

on:
  workflow_dispatch:
    inputs:
      max_series:
        description: "Max unchecked perfume series per runner IP before chaining to a fresh runner"
        required: false
        default: "80"

permissions:
  contents: write
  actions: write

concurrency:
  group: google-trends-catalog-filter
  cancel-in-progress: false

jobs:
  filter-trends:
    name: Filter Catalog via Google Trends (BG/RO/GR/HU)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Google Trends DB filter (series-aware, non-destructive)
        id: filter
        run: |
          python Al-Warda/scripts/google_trends_filter.py \
            --filter-all-db \
            --completed-first \
            --max-series "$MAX_SERIES"
        env:
          MAX_SERIES: ${{ inputs.max_series || '80' }}
          SUPABASE_URL: https://al-warda.egor-grebennykov.workers.dev
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

      - name: Commit updated Google Trends cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Al-Warda/server/data/googleTrendsCache.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(trends): update Google Trends cache"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Chain next batch if series remain
        if: steps.filter.outputs.remaining != '' && steps.filter.outputs.remaining != '0'
        env:
          MAX_SERIES: ${{ inputs.max_series || '80' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REMAINING: ${{ steps.filter.outputs.remaining }}
        run: |
          echo "Remaining series: $REMAINING. Dispatching next runner..."
          python -c "import os, requests; r = requests.post(f'https://api.github.com/repos/{os.environ[\"GH_REPO\"]}/actions/workflows/google-trends-filter.yml/dispatches', headers={'Accept': 'application/vnd.github+json', 'Authorization': f'Bearer {os.environ[\"GH_TOKEN\"]}'}, json={'ref': 'main', 'inputs': {'max_series': os.environ['MAX_SERIES']}}, timeout=15); print('Next dispatch:', r.status_code, r.text); r.raise_for_status()"
