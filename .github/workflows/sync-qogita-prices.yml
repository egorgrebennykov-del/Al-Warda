name: "Sync Aromadeal Prices & Stock"

on:
  schedule:
    # Sync live aromadeal.de prices & availability every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-qogita-prices
  cancel-in-progress: false

jobs:
  sync-prices:
    name: Sync Aromadeal Prices & Stock
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync live aromadeal.de prices & availability
        run: python Al-Warda/scripts/aromadeal_sync.py --prices
        env:
          NHOST_ADMIN_SECRET: ${{ secrets.NHOST_ADMIN_SECRET }}
          NHOST_GRAPHQL_URL: https://jopiirogydgupiwqiwac.graphql.eu-central-1.nhost.run/v1
