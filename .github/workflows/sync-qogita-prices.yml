name: "Sync Qogita Prices & Retail Pricing"

on:
  schedule:
    # Sync live Qogita MOV <= 500 EUR prices every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-qogita-prices
  cancel-in-progress: false

jobs:
  sync-prices:
    name: Sync Qogita MOV <= 500 Prices
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Al-Warda/package.json

      - name: Install Node Dependencies
        run: npm --prefix Al-Warda install

      - name: Sync live Qogita prices & recalculate retail pricing
        run: node --use-system-ca Al-Warda/scripts/sync_qogita_prices.mjs
        env:
          QOGITA_EMAIL: ${{ secrets.QOGITA_EMAIL }}
          QOGITA_PASSWORD: ${{ secrets.QOGITA_PASSWORD }}
          NHOST_ADMIN_SECRET: ${{ secrets.NHOST_ADMIN_SECRET }}
          NHOST_GRAPHQL_URL: https://jopiirogydgupiwqiwac.graphql.eu-central-1.nhost.run/v1
